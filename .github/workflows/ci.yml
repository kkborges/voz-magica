name: CI

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:
    branches: ['main']

jobs:
  quality:
    name: Tests & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx jest --ci

      - name: Lint
        run: npm run lint
        continue-on-error: true # ESLint configurado, mas não bloqueia ainda
